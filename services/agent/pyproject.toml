[project]
name = "mcs-agent"
version = "0.1.0"
description = "Matsui CS POC — agent service (FastAPI + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "neo4j>=5.26",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "cloud-sql-python-connector[pg8000]>=1.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["req(id): requirement id covered by the test (TC-<REQ-ID>)"]

[tool.ruff]
line-length = 110
target-version = "py312"
