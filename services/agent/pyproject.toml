[project]
name = "mcs-agent"
version = "0.1.0"
description = "Matsui CS POC — agent service (FastAPI + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "neo4j>=5.26",
    "structlog>=24.4",
    "google-genai>=3.6,<4",
    "anthropic[vertex]>=2.12,<3",
    "openai>=3.57,<4",
    "pyyaml>=6.0",
    "alembic>=1.14",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "google-cloud-storage>=2.18",
    "fastembed>=0.5",
    "langgraph>=0.6",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "cloud-sql-python-connector[pg8000]>=1.14",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "req(id): requirement id covered by the test (TC-<REQ-ID>)",
    "network: test needs real network (integration); unit tests are offline",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
