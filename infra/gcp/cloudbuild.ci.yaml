# CI on Cloud Build (LLD-17, NFR-DEP-02, NFR-MNT-01). Triggered by pushes/PRs to main (trigger `mcs-ci`);
# manual run: `make ci`. Docker runs only here, never on developer machines (D-015).
#   traceability + gitleaks       fail fast, in parallel with everything else
#   python: ruff, mypy, unit tests with FakeProvider (offline)
#   web: eslint, tsc
#   integration: ephemeral pgvector + Neo4j containers on the `cloudbuild` network → migrations, seed, KG, templates
options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/$PROJECT_ID/serviceAccounts/mcs-build@$PROJECT_ID.iam.gserviceaccount.com
timeout: 1800s

steps:
  - id: traceability
    name: ghcr.io/astral-sh/uv:0.7.3-python3.12-bookworm-slim
    waitFor: ['-']
    entrypoint: bash
    args: [-c, 'uv run --no-project --with-requirements tools/requirements.txt python tools/sync_docs.py --check']

  - id: gitleaks
    name: zricethezav/gitleaks:v8.21.2
    waitFor: ['-']
    args: [detect, --no-git, --source, ., --redact, --no-banner, -v]

  - id: start-services
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        docker run -d --name pg --network cloudbuild \
          -e POSTGRES_USER=mcs -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mcs_test pgvector/pgvector:pg16
        docker run -d --name neo4j --network cloudbuild -e NEO4J_AUTH=neo4j/ci-password-123 \
          -e NEO4J_server_memory_heap_max__size=512m -e NEO4J_server_memory_pagecache_size=256m neo4j:5.26

  - id: python
    name: ghcr.io/astral-sh/uv:0.7.3-python3.12-bookworm-slim
    waitFor: ['-']
    dir: services/agent
    env: [UV_LINK_MODE=copy]
    entrypoint: bash
    args: [-c, 'uv sync --frozen && uv run ruff check . && uv run mypy && uv run pytest tests/unit tests/security -q -m "not network"']

  - id: web
    name: node:20-bookworm-slim
    waitFor: ['-']
    dir: apps/web
    entrypoint: bash
    args: [-c, 'corepack enable && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test']

  - id: integration
    name: ghcr.io/astral-sh/uv:0.7.3-python3.12-bookworm-slim
    waitFor: [python, start-services]
    dir: services/agent
    env:
      - UV_LINK_MODE=copy
      - DATABASE_URL_TEST=postgresql+psycopg://mcs:ci@pg:5432/mcs_test
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ci-password-123
      - NEO4J_DATABASE=neo4j
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        uv run python - <<'PY'
        import os, time, psycopg
        from neo4j import GraphDatabase
        url = os.environ["DATABASE_URL_TEST"].replace("+psycopg", "")
        drv = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=("neo4j", os.environ["NEO4J_PASSWORD"]))
        for name, probe in (("postgres", lambda: psycopg.connect(url).close()), ("neo4j", drv.verify_connectivity)):
            for i in range(90):
                try:
                    probe(); print(f"{name} ready after {i * 2}s"); break
                except Exception:
                    time.sleep(2)
            else:
                raise SystemExit(f"{name} did not start")
        drv.close()
        PY
        uv run python ../../mock-data/kg/load_kg.py --wipe
        uv run pytest tests/integration tests/security -q -m network
